<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
            content="width=device-width, initial-scale=1.0"
            name="viewport"
    >

    <title>TickBun</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            width: 320px;
            min-height: 250px;

            font-family: -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            sans-serif;

            background: #ffffff;
            color: #1d192b;
        }

        .container {
            padding: 20px;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 10px;

            margin-bottom: 24px;
        }

        .logo {
            width: 32px;
            height: 32px;

            object-fit: contain;
        }

        .title {
            margin: 0;

            font-size: 18px;
            font-weight: 700;
        }

        .subtitle {
            margin: 2px 0 0;

            font-size: 12px;
            color: #777;
        }

        .setting-label {
            margin-bottom: 8px;

            font-size: 14px;
            font-weight: 600;
        }

        .duration-display {
            display: flex;
            align-items: center;
            justify-content: center;

            margin-bottom: 16px;

            font-size: 32px;
            font-weight: 700;
        }

        .duration-unit {
            margin-left: 6px;

            font-size: 14px;
            font-weight: 500;
            color: #777;
        }

        .slider-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .adjust-button {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 32px;
            height: 32px;

            padding: 0;

            border: 1px solid #ddd;
            border-radius: 50%;

            background: #fff;
            color: #1d192b;

            font-size: 20px;
            line-height: 1;

            cursor: pointer;
        }

        .adjust-button:hover {
            background: #f5f5f5;
        }

        .adjust-button:active {
            background: #eeeeee;
        }

        #duration {
            flex: 1;

            height: 4px;

            cursor: pointer;
        }

        .range-labels {
            display: flex;
            justify-content: space-between;

            margin-top: 6px;

            font-size: 11px;
            color: #888;
        }

        .quick-section {
            margin-top: 24px;
        }

        .quick-buttons {
            display: flex;
            gap: 8px;
        }

        .quick-button {
            flex: 1;

            padding: 8px 0;

            border: 1px solid #ddd;
            border-radius: 8px;

            background: #fff;
            color: #1d192b;

            font-size: 13px;
            font-weight: 600;

            cursor: pointer;
        }

        .quick-button:hover {
            background: #f5f5f5;
        }

        .quick-button.active {
            border-color: #1d192b;
            background: #1d192b;
            color: #fff;
        }

        .session-section {
            margin-top: 24px;
        }

        .session-card {
            padding: 12px 14px;

            border: 1px solid #eee;
            border-radius: 10px;

            background: #fafafa;
        }

        .session-header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 8px;
        }

        .session-header .setting-label {
            margin-bottom: 0;
        }

        .badge {
            padding: 2px 8px;

            border-radius: 999px;

            background: #eee;
            color: #555;

            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.03em;
        }

        .badge[data-status="RUNNING"] {
            background: #e3f4e8;
            color: #1e7a3c;
        }

        .badge[data-status="FINISHED"] {
            background: #e8eaf6;
            color: #3949ab;
        }

        .badge[data-status="UNAVAILABLE"] {
            background: #fdecea;
            color: #b3261e;
        }

        .session-rows {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 4px 12px;

            margin: 0;

            font-size: 12px;
        }

        .session-rows dt {
            color: #777;
        }

        .session-rows dd {
            margin: 0;

            text-align: right;
            font-variant-numeric: tabular-nums;
            font-weight: 600;
        }

        .session-rows dd.due {
            color: #b3261e;
        }

        .session-rows dd.session-progress {
            grid-column: 1 / -1;

            margin: 2px 0;
        }

        .progress-track {
            height: 6px;

            overflow: hidden;

            border-radius: 999px;

            background: #e6e6e6;
        }

        .progress-fill {
            width: 0;
            height: 100%;

            border-radius: inherit;

            background: #1d192b;

            transition: width 0.3s linear;
        }

        .progress-fill.due {
            background: #b3261e;
        }

        .session-id {
            margin-top: 8px;

            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;

            font-size: 10px;
            color: #aaa;
        }

        .status {
            min-height: 16px;

            margin-top: 16px;

            text-align: center;

            font-size: 11px;
            color: #888;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <img
                alt="TickBun"
                class="logo"
                src="icon.png"
        >

        <div>
            <h1 class="title">TickBun</h1>
            <p class="subtitle">Time Tracker & Break Reminder</p>
        </div>
    </div>


    <div class="setting-label">
        Focus duration
    </div>


    <div class="duration-display">
        <span id="duration-value"></span>
        <span class="duration-unit">min</span>
    </div>


    <div class="slider-row">

        <button
                aria-label="Decrease duration"
                class="adjust-button"
                id="decrease"
                type="button"
        >
            −
        </button>

        <input
                id="duration"
                type="range"
        >

        <button
                aria-label="Increase duration"
                class="adjust-button"
                id="increase"
                type="button"
        >
            +
        </button>

    </div>


    <div class="range-labels">
        <span id="duration-min-label"></span>
        <span id="duration-max-label"></span>
    </div>


    <div class="quick-section">

        <div class="setting-label">
            Quick select
        </div>

        <div class="quick-buttons">

            <button
                    class="quick-button"
                    data-duration="30"
                    type="button"
            >
                30
            </button>

            <button
                    class="quick-button"
                    data-duration="60"
                    type="button"
            >
                60
            </button>

            <button
                    class="quick-button"
                    data-duration="90"
                    type="button"
            >
                90
            </button>

        </div>

    </div>


    <section aria-live="polite" class="session-section">

        <div class="session-header">
            <div class="setting-label">
                Current session
            </div>

            <span class="badge" data-status="IDLE" id="session-status">
                IDLE
            </span>
        </div>

        <div class="session-card">

            <dl class="session-rows">
                <dt>Started</dt>
                <dd id="session-started">—</dd>

                <dt>Reminder at</dt>
                <dd id="session-deadline">—</dd>

                <dt>Elapsed</dt>
                <dd id="session-elapsed">—</dd>

                <dt>Remaining</dt>
                <dd id="session-remaining">—</dd>

                <dd class="session-progress">
                    <div
                            aria-label="Session progress"
                            aria-valuemax="100"
                            aria-valuemin="0"
                            aria-valuenow="0"
                            class="progress-track"
                            id="session-progress"
                            role="progressbar"
                    >
                        <div class="progress-fill" id="session-progress-fill"></div>
                    </div>
                </dd>

                <dt>Reminder</dt>
                <dd id="session-reminder">—</dd>
            </dl>

            <div class="session-id" id="session-id"></div>

        </div>

    </section>

</div>


<script src="popup.js" type="module"></script>

</body>
</html>
